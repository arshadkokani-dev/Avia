services:
  postgres:
    image: postgres:17-alpine
    container_name: avia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avia_dev
      POSTGRES_USER: avia
      POSTGRES_PASSWORD: avia_dev_password
    ports:
      - "5432:5432"
    volumes:
      - avia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avia -d avia_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  avia_postgres_data: